<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hierarquia mensal — Hapvida</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23003F7F'/><text x='50' y='72' text-anchor='middle' font-size='64' font-family='Arial,sans-serif' font-weight='bold' fill='white'>H</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f0f4f8;color:#222;font-size:13px}
.h1{background:#003F7F;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid #FF6B00}
.h1 h1{font-size:1.15rem;font-weight:700}
.h1 .sub{font-size:.78rem;color:#cfe0f2}
.wrap{max-width:1400px;margin:18px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:16px 18px;margin-bottom:14px}
.authbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:none;padding:7px 14px;border-radius:5px;font-weight:700;cursor:pointer;font-size:.82rem;text-decoration:none;display:inline-block}
.btn-red{background:#c0392b;color:#fff}
.btn-ghost{background:#fff;color:#0057A8;border:1px solid #cbd8e6}
.btn-ghost:hover{background:#eef4fb}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.pill-admin{background:#e7f0fa;color:#00519c;border:1px solid #c6dcf3}
.pill-sup{background:#fdf3e7;color:#a35b00;border:1px solid #f0dcbe}
.pill-ler{background:#f1f5f9;color:#5b6b7c;border:1px solid #dde5ee}
.pill-aberta{background:#eaf7f0;color:#1a7a4a;border:1px solid #c9e8d8}
.pill-fechada{background:#f1f5f9;color:#5b6b7c;border:1px solid #dde5ee}
.pill-recon{background:#fdf7e7;color:#8a6d1c;border:1px solid #f0e2bd}
.mesbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mesbar select{padding:7px 10px;border:1px solid #ccc;border-radius:5px;font-size:.92rem;font-weight:700;color:#003F7F}
.mesbar .lbl{font-size:.72rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.4px}
.relinfo{margin-top:10px;padding:10px 14px;border-left:4px solid #7f8c8d;background:#f7f9fb;color:#34495e;font-size:.84rem;line-height:1.5}
.relinfo.ok{border-left-color:#1a9b61;background:#eefaf4}
.relinfo.warn{border-left-color:#e39b21;background:#fff8e8}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-left:5px solid #0057A8;border-radius:8px;padding:14px 16px}
.kpi.k-josy{border-left-color:#FF6B00}
.kpi.k-out{border-left-color:#8a94a0}
.kpi.k-tot{border-left-color:#003F7F;background:#f6f9fc}
.kpi .k-lbl{font-size:.72rem;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.4px}
.kpi .k-val{font-size:1.9rem;font-weight:700;color:#003F7F;line-height:1.15;margin-top:2px}
.kpi.k-josy .k-val{color:#c25200}
.kpi .k-val small{font-size:.8rem;font-weight:600;color:#888;margin-left:4px}
.kpi .k-sub{font-size:.76rem;color:#666;margin-top:3px}
.kpi .k-split{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.kpi .k-chip{display:inline-flex;align-items:baseline;gap:5px;background:#f2f6fb;border:1px solid #e2e8f0;border-radius:12px;padding:2px 9px;font-size:.71rem;color:#666;white-space:nowrap}
.kpi .k-chip b{font-size:.84rem;color:#003F7F}
.kpi .k-chip.compl{background:#fdf3e7;border-color:#f0dcbe;color:#9a6a1c}
.kpi .k-chip.compl b{color:#b3701a}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctrl select,.ctrl input[type=text]{padding:6px 9px;border:1px solid #ccc;border-radius:5px;font-size:.82rem}
.ctrl input[type=text]{min-width:240px}
.ctrl label.chk{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;color:#444;cursor:pointer}
#count{font-size:.8rem;color:#555;margin-left:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:700;color:#fff;white-space:nowrap}
.b-ativo{background:#1a7a4a}.b-pausa{background:#c98a1b}.b-fora{background:#8a94a0}.b-adm{background:#0057A8}
.tag{display:inline-block;font-size:.68rem;font-weight:700;border-radius:9px;padding:1px 8px;white-space:nowrap;border:1px solid transparent}
.tag-rel{background:#e7f0fa;color:#00519c;border-color:#c6dcf3}
.tag-cpl{background:#fdf3e7;color:#a35b00;border-color:#f0dcbe}
.tag-terc{background:#f3ecfa;color:#6b3fa0;border-color:#dccaf0}
.tag-cargo{background:#f1f5f9;color:#5b6b7c;border-color:#dde5ee}
.al{display:inline-block;font-size:.68rem;border-radius:9px;padding:1px 8px;white-space:nowrap;cursor:help;border:1px solid transparent}
.al-fora{background:#fff4e0;color:#9a5b00;border-color:#f3d9a8}
.al-div{background:#fdecea;color:#a1271b;border-color:#f3c4be}
.al-sem{background:#f1f5f9;color:#5b6b7c;border-color:#dde5ee}
.al-info{background:#e7f0fa;color:#00519c;border-color:#c6dcf3}
/* árvore */
.tree details{margin:0}
.tree summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;user-select:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:'▸';color:#0057A8;display:inline-block;width:14px;transition:transform .12s;flex:0 0 auto}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary:hover{background:#eef4fb}
.tree .nome{font-weight:700;color:#22303f;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .stats{margin-left:auto;display:flex;gap:14px;align-items:baseline;font-size:.78rem;color:#555;white-space:nowrap;flex:0 0 auto}
.tree .stats b{color:#003F7F;font-size:.88rem}
.tree .stats .meta b{color:#c25200}
.lv1>summary{background:#e7f0fa;font-size:.95rem;margin-top:8px}
.lv1>summary .nome{font-size:.98rem;color:#003F7F}
.lv2>summary .nome{color:#0b3a66}
.lv3>summary .nome{font-weight:600;color:#3b4a5a}
.children{margin-left:16px;border-left:2px solid #e2e8f0;padding-left:8px}
.leaf{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:5px;border-bottom:1px solid #f3f5f8;flex-wrap:wrap}
.leaf:hover{background:#f7fafd}
.leaf .nm{min-width:240px;max-width:340px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaf .nm a{color:#0057A8;text-decoration:none}
.leaf .nm a:hover{text-decoration:underline}
.leaf .nm .sub{display:block;font-weight:400;font-size:.7rem;color:#7a8896}
.leaf .mt{min-width:62px;text-align:right;font-weight:700;color:#c25200}
.leaf .mt.vazio{color:#b0b8c2;font-weight:400}
.leaf .ar{min-width:120px;color:#555}
.leaf .rest{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.vazio-msg{padding:30px;text-align:center;color:#7a8896}
.loading{display:none;padding:14px;text-align:center;font-weight:700;color:#0057A8}
.loading.on{display:block}
.spin{width:16px;height:16px;border:3px solid #cbd8e6;border-top-color:#0057A8;border-radius:50%;display:inline-block;margin-right:8px;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.74rem;color:#666;margin-top:12px;padding-top:10px;border-top:1px dashed #e2e8f0}
#toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#123;color:#fff;padding:11px 15px;border-radius:7px;font-size:.83rem;box-shadow:0 6px 22px rgba(0,0,0,.22);max-width:380px}
.toast.ok{background:#1a7a4a}.toast.err{background:#c0392b}
#login-overlay{position:fixed;inset:0;background:#f0f4f8;display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
#login-overlay.hidden{display:none}
.login-box{background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.12);padding:40px 36px;width:100%;max-width:360px;text-align:center}
.login-logo{width:60px;height:60px;background:#003F7F;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;color:#fff;font-weight:700}
.login-box h2{font-size:1.1rem;margin-bottom:4px}
.login-box p{font-size:.85rem;color:#666;margin-bottom:18px}
.login-box input{width:100%;padding:9px 12px;border:1px solid #ccc;border-radius:5px;font-size:.9rem;margin-bottom:12px}
.login-box button{width:100%;padding:9px 12px;border:none;border-radius:5px;background:#0057A8;color:#fff;font-weight:700;cursor:pointer;font-size:.88rem}
.login-error{color:#c0392b;font-size:.8rem;min-height:16px;margin-top:8px}
.btn-blue{background:#0057A8;color:#fff}
.btn-blue:disabled,.btn-red:disabled,.btn-ghost:disabled{opacity:.55;cursor:default}
.leaf .who{color:#0057A8;cursor:pointer}
.leaf .who:hover{text-decoration:underline}
.leaf .who::after{content:' ✎';font-size:.7rem;color:#9bb3cc}
.leaf.rem{opacity:.55}
.leaf.rem .nm{text-decoration:line-through}
.tag-aj{background:#e9f7ee;color:#16703f;border-color:#bfe3cd}
.al-ok{background:#e9f7ee;color:#16703f;border-color:#bfe3cd}
#modal{position:fixed;inset:0;background:rgba(15,30,50,.5);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:100%;max-width:640px;padding:20px 22px}
.mbox h2{font-size:1.05rem;color:#003F7F;margin-bottom:2px}
.mbox .msub{font-size:.78rem;color:#6b7a89;margin-bottom:14px}
.mbox .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.mbox .full{grid-column:1/-1}
.mbox label{display:block;font-size:.7rem;font-weight:700;color:#5b6b7c;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.mbox input,.mbox select{width:100%;padding:7px 9px;border:1px solid #c9d3de;border-radius:5px;font-size:.88rem;background:#fff}
.mbox input:focus,.mbox select:focus{outline:2px solid #9ec5ee;border-color:#0057A8}
.mbox .hint{font-size:.7rem;color:#8a6d1c;margin-top:3px;min-height:14px}
.mbox .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.mbox .acts .sp{flex:1}
.mbox .hist{margin-top:16px;padding-top:12px;border-top:1px dashed #dbe3ec;font-size:.76rem;color:#444;max-height:170px;overflow:auto}
.mbox .hist .hi{padding:4px 0;border-bottom:1px solid #f1f4f8}
.mbox .hist .hi b{color:#003F7F}
.cand{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;margin-top:6px;cursor:pointer}
.cand:hover{background:#eef4fb;border-color:#9ec5ee}
.cand .cn{font-weight:700;color:#22303f}
.cand .cs{font-size:.74rem;color:#6b7a89}
@media (max-width:700px){
  .mbox .grid{grid-template-columns:1fr}
  .tree .stats{gap:8px}
  .leaf .nm{min-width:0;max-width:none;flex:1 1 100%}
  .leaf .rest{margin-left:0}
}
</style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <div class="login-logo">H</div>
    <h2>Hierarquia mensal</h2>
    <p>Hapvida — entre com seu e-mail corporativo</p>
    <input type="email" id="login-email" placeholder="E-mail" autocomplete="username">
    <input type="password" id="login-input" placeholder="Senha" autocomplete="current-password">
    <button id="login-btn" onclick="checkLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="h1">
  <h1>🌳 Hierarquia mensal</h1>
  <span class="sub">Gestão → supervisor → equipe → promotor, com a meta de cada pessoa no mês — clique na pessoa para mover, ajustar meta ou status</span>
  <span style="flex:1"></span>
  <a class="btn btn-ghost" href="index.html">← Cadastro de Promotores</a>
</div>

<div class="wrap">

  <div class="card authbar">
    <span id="authStatus" style="font-weight:700;color:#c0392b">🔒 Não autenticado</span>
    <span id="perfilPill"></span>
    <span style="flex:1"></span>
    <button id="logoutBtn" class="btn btn-red" style="display:none" onclick="doLogout()">Sair</button>
  </div>

  <div class="card">
    <div class="mesbar">
      <span class="lbl">Mês</span>
      <select id="selMes" onchange="trocaMes(this.value)"></select>
      <span id="mesStatus"></span>
    </div>
    <div class="relinfo" id="relInfo">Carregando…</div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <div class="ctrl">
      <input type="text" id="fBusca" placeholder="Buscar pessoa, supervisor ou equipe…" oninput="render()">
      <select id="fStatus" onchange="render()"><option value="TODOS">Todos os status</option></select>
      <select id="fOrg" onchange="render()">
        <option value="TODOS">Próprio e terceiros</option>
        <option value="TIME PRÓPRIO">Time próprio</option>
        <option value="TIME TERCEIROS">Time terceiros</option>
        <option value="SEM">Sem organização</option>
      </select>
      <label class="chk"><input type="checkbox" id="fAlerta" onchange="render()"> Só com alerta</label>
      <label class="chk" id="lblRem" style="display:none"><input type="checkbox" id="fRem" onchange="render()"> Mostrar removidos do mês</label>
      <button class="btn btn-ghost" onclick="abreTodos(true)">Expandir tudo</button>
      <button class="btn btn-ghost" onclick="abreTodos(false)">Recolher tudo</button>
      <button class="btn btn-blue" id="btnIncluir" style="display:none" onclick="abreIncluir()">＋ Incluir pessoa</button>
      <span id="count"></span>
    </div>
    <div class="loading" id="loading"><span class="spin"></span>Carregando a hierarquia…</div>
    <div class="tree" id="tree"></div>
    <div class="legend" id="legend"></div>
  </div>

</div>
<div id="modal" onclick="if(event.target===this)fechaModal()"><div class="mbox" id="mbox"></div></div>
<datalist id="dlSup"></datalist><datalist id="dlSd"></datalist>
<div id="toast"></div>

<script>
// ════════════ SUPABASE — HIERARQUIA MENSAL (leitura e edição por RPC) ════════════
// Mesmo projeto, mesma chave publicável e mesmo login do index.html (Cadastro de Promotores).
// Os dados vêm só das RPCs hierarquia_competencias_lista() e hierarquia_arvore(), que filtram pelo
// perfil: admin vê/edita tudo; supervisor vê/edita as gestões dele; sem perfil vê a estrutura SEM a meta e não edita.
// Edição: hierarquia_ajustar / hierarquia_incluir / hierarquia_desfazer (o banco confere perfil, gestão e mês aberto).
var SUPA_URL = "https://ikhihjdkxnfarvwitdcy.supabase.co";
var SUPA_ANON = "sb_publishable_91SmDRibhQYNRTL8VQK7Qg_Po7X5Voe";
var SB = null;
try { SB = window.supabase.createClient(SUPA_URL, SUPA_ANON); } catch (e) {}

window._perfil = { papel: 'leitura', gestoes: [] };
window._meses = [];
window._mes = null;
window._linhas = [];

var MESES_PT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
var ORDEM_GESTAO = ['FABIO', 'JOSY', 'ADMINISTRATIVO', 'TREINAMENTO'];
var NOME_GESTAO = { FABIO: 'Gestão FÁBIO', JOSY: 'Gestão JOSY', ADMINISTRATIVO: 'Administrativo', TREINAMENTO: 'Treinamento' };
var ALERTAS = {
  fora_do_snapshot: ['al-fora', 'fora da release', 'Não está na planilha do Desdobramento deste mês: não é o que os relatórios aplicam.'],
  diverge_cadastro: ['al-div', 'difere do cadastro', 'Gestão, supervisor ou supervisor direto da release diferem do cadastro vivo de hoje.'],
  sem_meta: ['al-sem', 'sem meta', 'Mês com release, mas esta pessoa não tem meta.'],
  sem_pessoa_id: ['al-sem', 'sem pessoa_id', 'A ficha no cadastro ainda não tem pessoa_id (a próxima release o grava).'],
  gestao_normalizada: ['al-info', 'ACTIONLINE em FÁBIO', 'No cadastro a gestão é ACTIONLINE; aqui aparece dentro de FÁBIO, como supervisor ACTIONLINE.'],
  sem_ficha_viva: ['al-sem', 'sem ficha viva', 'Não achei a ficha desta pessoa no cadastro atual.'],
  ajustado: ['al-ok', 'ajustado no mês', 'Posição, meta ou status editados nesta página: vale sobre a release e o complemento.'],
  removido: ['al-sem', 'removido do mês', 'Tirada da hierarquia deste mês (aparece só com "Mostrar removidos").']
};

// ── helpers ──
function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmtN(n) { return Number(n || 0).toLocaleString('pt-BR'); }
function fmtStamp(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function rotuloMes(c) {
  var p = String(c || '').split('-');
  if (p.length < 2) return c;
  var m = MESES_PT[+p[1] - 1] || p[1];
  return m.charAt(0).toUpperCase() + m.slice(1) + '/' + p[0];
}
function toast(t, tipo) {
  var box = document.getElementById('toast'), el = document.createElement('div');
  el.className = 'toast ' + (tipo || '');
  el.textContent = t;
  box.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, tipo === 'err' ? 7000 : 4000);
}
function loading(on) { document.getElementById('loading').classList.toggle('on', !!on); }
function metaVisivel() { var p = window._perfil.papel; return p === 'admin' || p === 'supervisor'; }

// ════════════ ACESSO (mesma mecânica do index.html) ════════════
async function initAuth() {
  if (!SB) { document.getElementById('login-error').textContent = 'Supabase não configurado — avise o administrador.'; return; }
  SB.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') abrirLogin(); });
  var s = await SB.auth.getSession();
  var user = s && s.data && s.data.session ? s.data.session.user : null;
  if (user) entrar(user); else abrirLogin();
}
function abrirLogin() {
  document.getElementById('login-overlay').classList.remove('hidden');
  setTimeout(function () { var e = document.getElementById('login-email'); if (e) e.focus(); }, 30);
}
async function entrar(user) {
  setAuth(user);
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-input').value = '';
  await loadPerfil();
  pintaPerfil();
  await carregaMeses();
}
function setAuth(user) {
  var st = document.getElementById('authStatus');
  st.textContent = user ? ('🔓 Conectado como ' + user.email) : '🔒 Não autenticado';
  st.style.color = user ? '#1a7a4a' : '#c0392b';
  document.getElementById('logoutBtn').style.display = user ? '' : 'none';
}
async function loadPerfil() {
  window._perfil = { papel: 'leitura', gestoes: [] };
  try {
    var r = await SB.from('app_perfis').select('papel,gestoes').limit(1);
    if (!r.error && r.data && r.data.length) window._perfil = { papel: r.data[0].papel || 'leitura', gestoes: r.data[0].gestoes || [] };
  } catch (e) { /* sem perfil = leitura */ }
}
function pintaPerfil() {
  var p = window._perfil, h;
  if (p.papel === 'admin') h = '<span class="pill pill-admin">★ Administrador — vê todas as gestões e as metas</span>';
  else if (p.papel === 'supervisor') h = '<span class="pill pill-sup">✎ Supervisor — vê a(s) gestão(ões) ' + esc((p.gestoes || []).join(', ') || '(sem gestão)') + ' e as metas</span>';
  else h = '<span class="pill pill-ler">👁 Somente consulta — a estrutura aparece sem as metas</span>';
  document.getElementById('perfilPill').innerHTML = h;
}
async function checkLogin() {
  var btn = document.getElementById('login-btn'), err = document.getElementById('login-error');
  if (!SB) { err.textContent = 'Supabase não configurado — avise o administrador.'; return; }
  var email = (document.getElementById('login-email').value || '').trim();
  var pass = document.getElementById('login-input').value;
  if (!email || !pass) { err.textContent = 'Informe e-mail e senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...'; err.textContent = '';

  if (lk) h += '<a class="btn btn-ghost" href="' + lk + '" target="_blank" title="Abrir a ficha no cadastro">Ficha ↗</a>';
  if (r.origem === 'AJUSTE') h += '<button class="btn btn-ghost" onclick="desfazAjuste()" title="Volta ao que a release/complemento diz">Desfazer ajuste</button>';
  h += r.removido ? '<button class="btn btn-ghost" onclick="removeDoMes(false)">Restaurar no mês</button>'
                  : '<button class="btn btn-red" onclick="removeDoMes(true)">Tirar do mês</button>';
  h += '</div><div class="hist" id="hist"><i>Carregando histórico…</i></div>';
  abreModal(h);
  pintaListas();
  SB.rpc('hierarquia_historico', { p_competencia: window._mes + '-01', p_pessoa_id: pid }).then(function (x) {
    var el = document.getElementById('hist');
    if (!el || !window._ed || window._ed.pid !== pid) return;
    if (x.error) { el.innerHTML = '<i>Histórico indisponível: ' + esc(x.error.message) + '</i>'; return; }
    var its = x.data || [];
    if (!its.length) { el.innerHTML = '<i>Sem edições neste mês — vale o que a ' + ((r.origem_base || r.origem) === 'RELEASE' ? 'release' : 'carga do complemento') + ' diz.</i>'; return; }
    el.innerHTML = '<b>Histórico</b>' + its.map(function (i) { return '<div class="hi"><b>' + esc(i.acao) + '</b> · ' + esc(fmtStamp(i.em)) + ' · ' + esc(i.usuario || '') + resumoMud(i.antes, i.depois) + (i.motivo ? ' — <i>' + esc(i.motivo) + '</i>' : '') + '</div>'; }).join('');
  });
}
function resumoMud(a, d) {
  if (!d) return '';
  var cs = [], rot = { gestao: 'gestão', supervisor: 'supervisor', supervisor_direto: 'equipe', area: 'área', status_promotor: 'status', meta: 'meta', removido: 'removido' };
  Object.keys(rot).forEach(function (k) {
    if (!(k in d)) return;
    var antes = a ? a[k] : null;
    if (String(antes == null ? '' : antes) !== String(d[k] == null ? '' : d[k])) cs.push(rot[k] + ': ' + (a ? (antes == null || antes === '' ? '—' : antes) + ' → ' : '') + (d[k] == null || d[k] === '' ? '—' : d[k]));
  });
  return cs.length ? ' · ' + esc(cs.join('; ')) : '';
}
async function salvaEdicao() {
  var ed = window._ed; if (!ed || ed.modo !== 'editar') return;
  var f = lerForm(), r = ed.linha, c = {};
  if (f.gestao !== r.gestao) c.gestao = f.gestao;
  if (f.supervisor !== norm(r.supervisor).toUpperCase()) c.supervisor = f.supervisor;
  if (f.supervisor_direto !== norm(r.supervisor_direto).toUpperCase()) c.supervisor_direto = f.supervisor_direto;
  if (f.area !== norm(r.area)) c.area = f.area;
  if (f.status_promotor !== norm(r.status_promotor).toUpperCase().replace('É', 'E').replace('Ç', 'C')) c.status_promotor = f.status_promotor;
  if (metaVisivel() && (f.meta == null ? null : f.meta) !== (r.meta == null ? null : Number(r.meta))) c.meta = f.meta == null ? null : String(f.meta);
  if (!Object.keys(c).length) { toast('Nada mudou.', ''); return; }
  btnBusy('btnSalvarEd', true, 'Salvando…');
  var x = await SB.rpc('hierarquia_ajustar', { p_competencia: window._mes + '-01', p_pessoa_id: ed.pid, p_campos: c, p_motivo: f.motivo || null });
  btnBusy('btnSalvarEd', false, 'Salvar');
  if (x.error) { toast('Não salvou: ' + x.error.message, 'err'); return; }
  aplicaLinha(x.data && x.data.linha);
  toast('Salvo: ' + r.promotor + ' em ' + rotuloMes(window._mes) + '.', 'ok');
  fechaModal(); aposMudanca();
}
async function removeDoMes(rem) {
  var ed = window._ed; if (!ed) return;
  var r = ed.linha;
  if (rem && !confirm('Tirar ' + r.promotor + ' da hierarquia de ' + rotuloMes(window._mes) + '?\n(Dá para restaurar depois; o cadastro não é alterado.)')) return;
  var x = await SB.rpc('hierarquia_ajustar', { p_competencia: window._mes + '-01', p_pessoa_id: ed.pid, p_campos: { removido: rem }, p_motivo: norm(document.getElementById('f_motivo').value) || null });
  if (x.error) { toast('Não consegui: ' + x.error.message, 'err'); return; }
  aplicaLinha(x.data && x.data.linha);
  toast(rem ? (r.promotor + ' saiu da hierarquia de ' + rotuloMes(window._mes) + '.') : (r.promotor + ' voltou ao mês.'), 'ok');
  fechaModal(); aposMudanca();
}
async function desfazAjuste() {
  var ed = window._ed; if (!ed) return;
  var r = ed.linha;
  if (!confirm('Desfazer os ajustes de ' + r.promotor + ' em ' + rotuloMes(window._mes) + '? Volta ao que a release/complemento diz.')) return;
  var x = await SB.rpc('hierarquia_desfazer', { p_competencia: window._mes + '-01', p_pessoa_id: ed.pid });
  if (x.error) { toast('Não consegui: ' + x.error.message, 'err'); return; }
  if (x.data && x.data.linha) aplicaLinha(x.data.linha); else tiraLinha(ed.pid);
  toast('Ajuste desfeito: ' + r.promotor + '.', 'ok');
  fechaModal(); aposMudanca();
}

// ── incluir alguém do cadastro que ainda não está no mês ──
var _tBusca = null;
function abreIncluir() {
  window._ed = { modo: 'busca' };
  abreModal('<h2>Incluir pessoa em ' + esc(rotuloMes(window._mes)) + '</h2><div class="msub">Busque no cadastro de promotores quem ainda não está na hierarquia deste mês.</div>' +
    '<input id="q_cand" placeholder="Digite ao menos 2 letras do nome…" oninput="buscaCand()" autocomplete="off"><div id="listaCand"></div>' +
    '<div class="acts"><button class="btn btn-ghost" onclick="fechaModal()">Fechar</button></div>');
  setTimeout(function () { var e = document.getElementById('q_cand'); if (e) e.focus(); }, 30);
}
function buscaCand() {
  clearTimeout(_tBusca);
  _tBusca = setTimeout(async function () {
    var q = norm(document.getElementById('q_cand').value), box = document.getElementById('listaCand');
    if (q.length < 2) { box.innerHTML = ''; return; }
    var x = await SB.rpc('hierarquia_candidatos', { p_competencia: window._mes + '-01', p_busca: q });
    if (x.error) { box.innerHTML = '<div class="hint">' + esc(x.error.message) + '</div>'; return; }
    window._cands = x.data || [];
    box.innerHTML = window._cands.length ? window._cands.map(function (c, i) {
      return '<div class="cand" onclick="escolheCand(' + i + ')"><div><div class="cn">' + esc(c.nome_abreviado) + '</div><div class="cs">' + esc(c.nome_completo || '') + '</div></div>' +
        '<span style="margin-left:auto" class="cs">' + esc([c.cargo, c.gestao, c.supervisor, c.status_promotor].filter(Boolean).join(' · ')) + '</span></div>';
    }).join('') : '<div class="hint">Ninguém encontrado fora da hierarquia deste mês.</div>';
  }, 280);
}
function escolheCand(i) {
  var c = (window._cands || [])[i]; if (!c) return;
  var g = String(c.gestao || '').toUpperCase() === 'ACTIONLINE' ? 'FABIO' : String(c.gestao || '').toUpperCase();
  var sup = String(c.gestao || '').toUpperCase() === 'ACTIONLINE' ? 'ACTIONLINE' : norm(c.supervisor).toUpperCase();
  window._ed = { modo: 'incluir', cand: c, supAnterior: sup };
  var h = '<h2>Incluir ' + esc(c.nome_abreviado) + '</h2><div class="msub">' + esc(rotuloMes(window._mes)) + ' · preenchido com o cadastro; ajuste se for diferente neste mês.</div>';
  h += formHtml({ gestao: g, supervisor: sup, supervisor_direto: norm(c.supervisor_direto).toUpperCase(), area: c.area, status_promotor: c.status_promotor, meta: null }, metaVisivel());
  h += '<div class="acts"><button class="btn btn-blue" id="btnIncl" onclick="confirmaIncluir()">Incluir no mês</button><button class="btn btn-ghost" onclick="abreIncluir()">‹ Voltar à busca</button></div>';
  abreModal(h);
  pintaListas();
}
async function confirmaIncluir() {
  var ed = window._ed; if (!ed || ed.modo !== 'incluir') return;
  var f = lerForm(), c = { gestao: f.gestao, supervisor: f.supervisor, supervisor_direto: f.supervisor_direto, area: f.area, status_promotor: f.status_promotor };
  if (metaVisivel() && f.meta != null) c.meta = String(f.meta);
  btnBusy('btnIncl', true, 'Incluindo…');
  var x = await SB.rpc('hierarquia_incluir', { p_competencia: window._mes + '-01', p_promotor_id: ed.cand.id, p_campos: c, p_motivo: f.motivo || null });
  btnBusy('btnIncl', false, 'Incluir no mês');
  if (x.error) { toast('Não incluiu: ' + x.error.message, 'err'); return; }
  aplicaLinha(x.data && x.data.linha);
  toast(ed.cand.nome_abreviado + ' entrou na hierarquia de ' + rotuloMes(window._mes) + '.', 'ok');
  fechaModal(); aposMudanca();
}
document.addEventListener('click', function (e) {
  var w = e.target.closest ? e.target.closest('.who') : null;
  if (w && w.dataset.pid) abrePessoa(w.dataset.pid);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fechaModal(); });

// gancho para teste local sem login (alimenta a tela com linhas já carregadas)
window.HZ = {
  carrega: function (meses, linhas, perfil, mes) {
    window._meses = meses; window._mes = mes; window._linhas = linhas; window._perfil = perfil || window._perfil;
    document.getElementById('login-overlay').classList.add('hidden');
    document.getElementById('selMes').innerHTML = meses.map(function (m) { return '<option value="' + esc(m.competencia) + '">' + esc(rotuloMes(m.competencia)) + '</option>'; }).join('');
    document.getElementById('selMes').value = mes;
    pintaPerfil(); pintaMes(); montaFiltros(); renderKpis(); render();
  }
};

initAuth();
</script>
